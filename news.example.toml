# Copy to news.toml and edit. Like feeds.toml, this file is gitignored.
#
# Each [sources.<slug>] block defines one site to ingest from. The slug
# becomes the subfolder name under ./news/<slug>/ and the backup folder
# at <backup_path>/news/<slug>/text/.
#
# Output per article: ./news/<slug>/YYYY-MM-DD - <url-slug>.md
# Dedup index:        ./news/<slug>/.processed   (one URL per line)
# Backup mirror:      <backup_path>/news/<slug>/text/*.md   (when configured)

[defaults]
# Politeness — seconds between article fetches per source.
fetch_delay_seconds = 1.5
# Optional: where to mirror article markdown for offsite/SD-card backup.
# Same backup_path the podcast pipeline uses is fine — news lands under
# <backup_path>/news/<slug>/text/ so it never collides with podcast feeds.
# backup_path = "/Volumes/PodcastSD/archive"
# Skip articles older than this. Forward-only — doesn't touch already-ingested
# local files, only filters discovery on future runs. Accepts ISO date
# ("2026-01-01") or relative age ("1y", "6m", "2w", "14d"). Per-source
# `since` overrides this default.
# since = "1y"
# Number of consecutive fetch/extract failures before a URL is moved to
# .failed (and skipped on future runs). Default 3. Useful for unpublished
# drafts in RSS, stale sitemap entries, etc. Clear with --retry-failed.
# max_failures = 3

# ── Sources with native RSS ──────────────────────────────────────────────────

[sources.openai]
type = "rss"
url = "https://openai.com/news/rss.xml"

[sources.deepmind]
type = "rss"
url = "https://deepmind.google/blog/feed"

[sources.google-research]
type = "rss"
url = "https://research.google/blog/rss"

# swyx's daily AI news roundup, published as a section of the Latent Space
# Substack. Distinct from the smol.ai/news bot (terser daily blurbs) — this
# is the substantive weekday roundup with names like "[AINews] Cerebras'
# $60B IPO", "[AINews] The End of Finetuning". sectionId=327741 isolates
# the AINews-only stream (the bare /feed mixes podcast episodes in).
#
# Most posts are paywalled. To unlock with a paid subscription, set
# `sid = "..."` to the value of the `connect.sid` cookie on www.latent.space
# (Application → Cookies → www.latent.space in browser dev tools, NOT the
# substack.com cookie list — those are scoped to a different origin).
[sources.latent-space-ainews]
type = "rss"
url = "https://www.latent.space/feed?sectionId=327741"
# sid = "s%3A..."   # connect.sid cookie from www.latent.space; unlocks paid bodies

# Alternative discovery for Substack sections: the paginated archive API.
# RSS caps at 20 most-recent entries; the archive endpoint paginates the
# full history. Useful for backfilling beyond the RSS rolling window, and
# also works as the ongoing discovery method (dedup makes re-polls O(new)).
# Swap the section's [sources.<slug>] block to use this type when you want
# the full backlog; same slug means it shares the .processed dedup index
# with whatever was already ingested via RSS.
#
# [sources.latent-space-ainews]
# type = "substack-section-archive"
# base_url = "https://www.latent.space"
# section_id = 327741
# sid = "s%3A..."         # connect.sid cookie; required for paid-tier posts
# since = "2026-01-01"    # optional date / age floor; archive walks newest-first
                          # (legacy field: `min_date` still honored)

[sources.google-keyword]
type = "rss"
# AI-specific subfeed (filters out the generic Keyword noise like Brandcast,
# Es Devlin art posts, etc.). The bare /rss/ endpoint includes everything
# Google publishes; this subfeed filters to AI/Gemini consumer-product
# rollouts which complement DeepMind (research) and Google Research (academic).
url = "https://blog.google/technology/ai/rss/"

# ── Sources with no RSS — discovery via sitemap.xml ──────────────────────────

[sources.anthropic]
type = "sitemap"
sitemap_url = "https://www.anthropic.com/sitemap.xml"
path_filter = "/news/"

[sources.mistral]
type = "sitemap"
sitemap_url = "https://mistral.ai/sitemap.xml"
path_filter = "/news/"

[sources.xai]
type = "sitemap"
sitemap_url = "https://x.ai/sitemap.xml"
path_filter = "/news/"

# Cohere is behind Cloudflare bot protection. Sitemap discovery works, but
# per-article fetches get challenged and trafilatura only retrieves a stub
# (title + reading-time, no body). Disabled until a fetch strategy lands —
# see docs/news-roadmap.md "Known limitations".
# [sources.cohere]
# type = "sitemap"
# sitemap_url = "https://cohere.com/sitemap.xml"
# path_filter = "/blog/"

# AI21's top-level sitemap is an index; we want the post sub-sitemap directly.
[sources.ai21]
type = "sitemap"
sitemap_url = "https://www.ai21.com/post-sitemap.xml"
path_filter = "/blog/"

# ── Hugging Face Daily Papers ─────────────────────────────────────────────────
# Curated AI/ML research papers via JSON API. Daily volume is ~10–20 new papers;
# filter with min_upvotes + top_n to keep the wiki signal-to-noise high.
[sources.hf-papers]
type = "hf-daily-papers"
discovery_mode = "daily-api"      # "daily-api" (50 most-recent) or "weekly-html" (~105/week)
min_upvotes = 10                  # community-endorsement floor; filtered papers stay re-checkable
top_n = 5                         # per-poll cap after sorting (upvotes DESC, then submittedOnDailyAt DESC)
fetch_delay_seconds = 0.5         # HF API is fast; minimal politeness delay

# ── Static-markdown SPAs (Angular/React sites serving raw .md files) ─────────
# Some publishers ship a JS-only client app that fetches blog posts as static
# markdown at runtime (no SSR, no API, no RSS). This source type bypasses the
# need for a headless browser by:
#   1. Fetching `base_url + bundle_path` (default "/", the homepage)
#   2. Applying `bundle_regex` to find the main JS bundle URL
#   3. Fetching the bundle and applying `slug_regex` to enumerate articles
#   4. Fetching each `article_url_template` and parsing YAML frontmatter
#
# Trafilatura is skipped entirely — the publisher's own markdown is canonical.
#
# Example: antigravity.google. Bundle URL rotates on every deploy, so the
# bundle_regex matches the hash-suffixed filename pattern, not a literal URL.
[sources.antigravity]
type = "static-markdown-spa"
base_url = "https://antigravity.google"
# Optional. Page on base_url whose HTML contains a <script src=…> reference
# matched by bundle_regex. Defaults to "/" (the homepage), which is right
# for most SPAs.
# bundle_path = "/"
bundle_regex = '<script[^>]+src="(main-[A-Z0-9]+\.js)"'
slug_regex = 'link:"/blog/([a-z0-9-]+)"'
article_url_template = "/assets/blog-posts/{slug}.md"
