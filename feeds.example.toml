# Copy to feeds.toml and fill in your private RSS URLs.
# Each [feeds.<tag>] block defines a feed. The tag is used as the
# subfolder name under ./downloads/<tag>/ and ./transcripts/<tag>/.
#
# Backups (when configured) land at:
#   <backup_path>/<tag>/media/<file>.mp3   — copied during eviction
#   <backup_path>/<tag>/text/<file>.md     — copied on every operation,
#                                            never deleted from local
# Override either path with media_dir / transcript_dir at the feed level.

# ── Defaults applied to every feed (per-feed values override) ────────────────
[defaults]
# backup_path = "/Volumes/PodcastSD/archive"

# ── Feeds ────────────────────────────────────────────────────────────────────

[feeds.nates-notebook]
rss = "https://api.substack.com/feed/podcast/XXXXXX/private-key.rss"

# ── Optional per-feed settings ───────────────────────────────────────────────

# substack.sid cookie for paywalled transcripts.
# sid = "..."

# Cap the number of mp3s kept locally in ./downloads/<tag>/.
# Eviction runs after --download and --transcribe. Oldest mp3s go first,
# but only mp3s that already have a transcript are eligible — the source
# audio is never deleted unless its transcript exists.
# max_episodes_on_disk = 20

# Override [defaults].backup_path for just this feed.
# backup_path = "/Volumes/OtherSD/archive"

# Override the media or transcript path independently of backup_path.
# Useful for split storage (e.g. mp3s on SD, transcripts in a cloud-synced dir).
# media_dir = "/Volumes/Audio/nates-notebook"
# transcript_dir = "/Users/me/Dropbox/transcripts/nates-notebook"

# Default cap for --download / fetch in a single run. Useful for
# backfilling a new feed gradually instead of pulling 300 episodes at once.
# Overridden by `--limit N` on the CLI, or bypassed entirely with
# `--no-limit` (e.g. when pre-downloading on an unmetered network).
# max_downloads_per_run = 5

# Order to walk feed entries when downloading. Default: "newest".
# Use "oldest" for incremental backfill of an archive.
# download_order = "newest"   # or "oldest"

# Enable speaker diarization for this feed. Adds a pyannote pass over each
# mp3 during --transcribe and emits "**Speaker A** (mm:ss):" headers per
# turn in the .md output. Requires pyannote.audio installed and a HuggingFace
# token with the pyannote/speaker-diarization-3.1 license accepted.
# Useful for interview / panel feeds; leave off for monologue feeds —
# diarizing a single-speaker recording adds runtime and noisy headers.
# diarize = true

# Override the RSS-derived host name. The most-talked speaker in the first
# minute of the episode is rendered with this person's first name instead
# of "Speaker A". Defaults to itunes_author from the RSS channel.
# host = "Lex Fridman"

# Opt this feed out of the --daily macro (download + transcribe). Defaults
# to true. Useful for archived shows you keep configured for backfill but
# don't actively follow.
# daily = false

# Per-feed Whisper model. Defaults to `medium`. Useful for feeds with
# challenging audio (technical jargon, accents, music) — bump to
# `large-v3` for higher accuracy at the cost of ~2x runtime. Other feeds
# keep the default. CLI --model overrides when set.
# model = "large-v3"

# Lightning Whisper MLX batch size (default 12). Lower this for very long
# episodes (3 + hours) that trip Metal GPU command-buffer timeouts —
# smaller batches mean smaller per-op GPU work. Costs roughly proportional
# slowdown (batch=6 ≈ 2x slower than batch=12).
# whisper_batch_size = 6

# Run each episode in a fresh Python subprocess instead of an in-process loop.
# Defaults to false. The in-process loop is faster per episode (shared model
# load) but PyTorch's MPS allocator and MLX's Metal kernel cache accumulate
# state across episodes, causing progressive slowdown on long backlogs
# (50+ episodes). The per-episode reset (every RELOAD_EVERY=5 episodes)
# only partially clears this. Subprocess mode adds ~30-60s of model-load
# overhead per episode but makes per-episode cost predictable and bounded.
# Recommended when you observe diarize/Whisper times creeping upward across
# a single run. CLI: --subprocess-per-episode / --no-subprocess-per-episode.
# subprocess_per_episode = true

# How many transcribe subprocesses to run in parallel for this feed.
# Defaults to 1 (serial). Only meaningful with subprocess_per_episode = true.
# Each worker has its own pyannote + Whisper instance (~3 GB unified memory).
# Workers share the Metal command queue, so per-episode pace drops modestly
# while total throughput rises (concurrency=2 ≈ 1.6× single-worker throughput).
# Safe up to ~4 on a 64 GB machine. CLI: --subprocess-concurrency N.
# subprocess_concurrency = 2

# [feeds.another-feed]
# rss = "https://api.substack.com/feed/podcast/YYYYYY/private-key.rss"
# max_episodes_on_disk = 10
# max_downloads_per_run = 3
# download_order = "oldest"
